[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mitra"
version = "0.1.0"
description = "Mitra (मित्रम्) — Sanskrit-speaking interactive robot on Reachy Mini Lite"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Each hardware/model layer is optional so the pipeline can be developed and
# tested piecemeal (fakes stand in for anything not installed).
robot = ["reachy-mini", "sounddevice"]        # add [mujoco] extra manually for simulation;
                                               # sounddevice backs mic_source: built_in
agent = ["strands-agents[ollama]>=1.0"]
bedrock = ["strands-agents>=1.0", "boto3>=1.34", "botocore>=1.34"]
# <1.0: every pipecat-ai 1.x hard-pins onnxruntime~=1.24.3, while reachy-mini
# >=1.9 pins onnxruntime==1.27.0. 0.0.99 makes onnxruntime optional and still
# provides the frame types src/orchestration/frames.py imports.
pipecat = ["pipecat-ai>=0.0.90,<1.0"]
wake = ["openwakeword>=0.6", "onnxruntime>=1.16"]
vad = ["silero-vad>=5.0", "torch>=2.3"]
asr = ["mlx-whisper>=0.4; platform_machine=='arm64' and sys_platform=='darwin'"]
asr-cpu = ["openai-whisper>=20231117"]
# Indic Parler-TTS additionally needs the parler-tts package, which is not on
# PyPI: pip install git+https://github.com/huggingface/parler-tts.git
speech = ["transformers>=4.46", "torch>=2.3", "soundfile>=0.12"]
# Morphology checks (DESIGN §5): a 30M-form inflected lexicon, a segmenter,
# and a Pāṇinian derivation engine. The wheel is small; the data it needs is
# fetched separately by scripts/fetch_sanskrit_data.py.
sanskrit = ["vidyut>=0.4"]
dev = ["pytest>=8.0"]
cloud = ["mitra[agent,bedrock]"]
all = ["mitra[robot,agent,wake,vad,asr,speech,sanskrit]"]
# Everything main.py loads at runtime in Bedrock + Pipecat mode (no Ollama).
cloud-pipecat = ["mitra[robot,bedrock,pipecat,wake,vad,asr,speech]"]

[project.scripts]
mitra-lexicon = "mitra.lexicon.store:review_cli"

[tool.setuptools]
package-dir = {"mitra" = "src"}
packages = [
    "mitra",
    "mitra.agent",
    "mitra.sanskrit",
    "mitra.audio",
    "mitra.eval",
    "mitra.lexicon",
    "mitra.orchestration",
    "mitra.robot",
    "mitra.speech",
]

[tool.setuptools.package-data]
"mitra.lexicon" = ["seed_lexicon.json", "vocabulary.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
