# Mitra grammar evaluation, 50 questions.
#
# Each question carries the expectations the scorer checks against the reply.
#   person:       expected grammatical person of the answer clause
#   tense:        present | future | past
#   content_any:  at least one of these must appear, else the reply is empty of
#                 an actual answer (the "My favorite food exists" failure)
#   forbid:       question-specific words that must not appear, on top of the
#                 global Hindi-marker and non-word lists in the scorer
#   pair:         two questions with the same pair id are near-synonyms; if both
#                 replies are byte-identical the scorer records a collapse
#   frame:        possessive  -> expects मम X अस्ति or मह्यं X रोचते, never अहं X प्रियं अस्मि
#
# Questions are asked in English, matching how runs A to D were driven.

questions:

  # --- A. daily actions, first person present -----------------------------
  - id: q01
    text: What are you doing?
    category: action
    person: first
    tense: present
    content_any: [करोमि, पठामि, वदामि, चिन्तयामि, कार्यं, पाठं]

  - id: q02
    text: Do you play?
    category: action
