# Mitra runtime configuration (DESIGN.md §7)
#
# LLM modes (issue #7):
#   models.llm.provider: ollama   — local/offline Qwen3-VL (default)
#   models.llm.provider: bedrock  — all conversational + vision inference via
#                                   Amazon Bedrock. Ollama/Qwen is not started,
#                                   loaded, or contacted. Credentials come from
#                                   the standard AWS chain; do not put keys here.
# Orchestration:
#   orchestration.engine: custom  — existing event-driven orchestrator (default)
#   orchestration.engine: pipecat — proof-of-concept frame pipeline

orchestration:
  engine: custom                 # custom | pipecat

robot:
  backend: reachy          # reachy (real Lite over USB, or --sim daemon) | fake
  mic_chunk_s: 0.08        # seconds of audio per microphone read
  gestures: true           # state poses: antennas perk when listening, head
                           # tilts while thinking, droops when asleep (FR-5.3)
  mic_source: built_in     # robot (default) | built_in — workaround for a macOS
                           # 26 (Tahoe) Core Audio regression that returns
                           # all-zero samples for the robot's own multichannel
                           # USB mic (pollen-robotics/reachy_mini#820). Camera,
                           # speaker, and motion are unaffected either way.
                           # Set back to "robot" once Apple/Pollen fix this.
  built_in_mic_device: "MacBook Pro Microphone"  # only used when mic_source: built_in

models:
  llm:
    provider: ollama       # ollama | anthropic | bedrock (Option B, DESIGN §1.5)
    host: "http://localhost:11434"
    id: "qwen3-vl:8b-instruct"  # NOT the bare :8b tag — that is the "thinking"
                                # variant: slow and returns empty content
    keep_alive: "30m"      # keeps the model resident between turns (REQUIREMENTS §8)
    temperature: 0.3
    think: false
    # Bedrock-only keys (ignored unless provider: bedrock). No secrets here.
    region: null           # default: AWS_REGION / AWS_DEFAULT_REGION
    timeout_s: 45
    connect_timeout_s: 5
    max_retries: 2
    max_tokens: 256
    top_p: null
    streaming: false
    fallback:              # explicit only — never a silent provider swap
      enabled: false
      provider: ollama
      id: "qwen3-vl:8b-instruct"
  asr:
    # turbo: half the download of large-v3 and 4-6x faster decoding at
    # near-equal en/kn accuracy — the first latency lever in REQUIREMENTS §8
    default: "mlx-community/whisper-large-v3-turbo"
    sanskrit: null         # HF repo of a Sanskrit Whisper fine-tune, once selected (Phase 3)
    backend: "mlx"
    device: "mps"
    initial_prompt: "Mitra. Short conversational questions in English, Kannada, or Sanskrit."
    condition_on_previous_text: false
    no_speech_threshold: 0.6
    compression_ratio_threshold: 2.4
    min_peak: 0.008
    filter_hallucinations: true
    english_retry: true
  tts:
    engine: "indic-parler-tts"
    model: "ai4bharat/indic-parler-tts"
    fallback: "facebook/mms-tts-hin"   # ungated VITS; auto-used when parler is inaccessible
    device: "mps"
    # Parler-TTS is steered by describing the voice in words, not by picking
    # a named voice — edit this description to change how Mitra sounds.
    voice_description: "A cheerful young child speaker with a bright, high-pitched voice delivers slow, warm, clear speech in a close-sounding recording with no background noise."
  wake:
    # asr: a small Whisper transcribes short speech windows and matches the
    # phrase — "hey mitra" works with no training. openwakeword: the target
    # engine once the custom "mitra" onnx model is trained (Phase 1, FR-1.4).
    engine: "asr"
    phrase: "mitra"
    asr_model: "mlx-community/whisper-small-mlx"  # tiny mis-hears "mitra"; small is accurate (see src/audio/wake.py)
    model: "models/mitra.onnx"   # used by engine: openwakeword
    threshold: 0.6
  vad:
    engine: "silero"       # silero | energy (dependency-free fallback)
    min_speech_s: 0.25     # honoured by Silero and energy (was previously dropped)
    min_silence_s: 0.7
    max_utterance_s: 15.0
    preroll_s: 0.25

agent:
  deterministic_vision: false   # true = orchestrator-mediated capture_image (DESIGN §1.4)

cloud_fallback:                 # FR-6.3 — no key/provider configured == feature absent
  enabled: false
  provider: null
  model_id: null

session:
  silence_timeout_s: 30
  max_reply_chars: 220

lexicon:
  db_path: "data/lexicon.db"

logging:
  dir: "logs"
  debug: false
