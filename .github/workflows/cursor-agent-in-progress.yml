# Kick a Cursor Cloud Agent on the AgentCore self-hosted pool when an
# `agent-*` issue moves to In Progress on
# https://github.com/orgs/kaushalavardhanam/projects/1
#
# Required repo secrets:
#   CURSOR_API_KEY     Cursor service account key (same value as the AgentCore worker)
#   GH_PROJECT_TOKEN   Fine-grained PAT: org kaushalavardhanam Projects: Read, plus
#                      repository access. GITHUB_TOKEN cannot read Projects v2.
#                      Update this token if it was issued only for user skopp002/projects/2.
#
# The AgentCore worker session must already be HealthyBusy or the job waits in the pool.
#
# NOTE (2026-09-26): Cursor's API returns 403 feature_unavailable — "Private
# workers are not enabled for your account" — because CURSOR_POOL_NAME
# requests a self-hosted pool that this Cursor plan doesn't have enabled. The
# claude-agent-in-progress.yml workflow now handles the same trigger via
# Claude Code / Bedrock instead. The `schedule` trigger below is disabled so
# this doesn't keep failing every 5 minutes; `workflow_dispatch` and the
# `issues: labeled` trigger are left in place so you can retrigger a specific
# issue manually. Once private workers are enabled on the Cursor account (or
# you drop the pool requirement), uncomment the `schedule:` block to resume
# automatic polling.
# Base branch: defaults to `main`, or per-issue via a `base:<branch>` label on
# the issue. Set base_branch on a manual workflow_dispatch run to force one.
name: Cursor agent on In Progress

on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to start immediately (optional)"
        required: false
      base_branch:
        description: "Force a base branch for this run (optional, overrides the base: label and default)"
        required: false
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  kickoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Cursor Cloud Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CURSOR_POOL_NAME: agentcore-platform-agents
          CURSOR_BASE_REF: main
          CURSOR_BASE_REF_OVERRIDE: ${{ github.event.inputs.base_branch }}
          PROJECT_OWNER: kaushalavardhanam
          PROJECT_OWNER_TYPE: organization
          PROJECT_NUMBER: "1"
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: python3 .github/scripts/kick_cursor_agent.py
